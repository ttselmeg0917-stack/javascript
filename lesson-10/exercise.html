<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <h2> ДАСГАЛ 1: Горим санах (Theme Saver)</h2>
    <h1>Gorim solih turshilt</h1>
    <button id="darkBtn">har gorim</button>
    <button id="lightBtn">tsagaan gorim</button>

    <hr>

    <h2> ДАСГАЛ 2: Зочны тоолуур (Visit Counter)</h2>
    <h2 id="counterText">Achaalj baina ...</h2>

    <hr>

    <h2>ДАСГАЛ 3: Нэрээ хадгалдаг Input (Name Saver)</h2>
    <input type="text" id="nameInput" placeholder="neree bichne vv">
    <button id="saveBtn">Hadgalah</button>

    <hr>

    <h2>ДАСГАЛ 4: Тоолуурын утга санах (Simple Counter)</h2>
    <h2 id="numberDisplay">0</h2>
    <button id="plusBtn">+</button>
    <button id="minusBtn">-</button>

    <hr>

    <h2>ДАСГАЛ 5: Дуртай өнгө хадгалах (Favorite Color)</h2>
    <button onclick="changeColor('red')">Улаан</button>
    <button onclick="changeColor('green')">Ногоон</button>
    <button onclick="changeColor('blue')">Хөх</button>

    <script src="js/exercise.js"></script>
</body>
</html>
