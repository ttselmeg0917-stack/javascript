<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON.stringify & parse Todo List</title>
    <style>
        body { 
	    font-family: sans-serif; 
	    background: #0f172a; 
	    color: #f8fafc; 
	    padding: 40px; 
	    display: flex; 
	    justify-content: center; 
	    }
    .card { 
	    background: #1e293b; 
	    padding: 30px; 
	    border-radius: 12px; 
	    width: 420px; 
	    box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
	    }
    .input-group { 
	    display: flex; 
	    gap: 8px; 
	    margin-bottom: 20px; 
	    }
    input { 
	    flex: 1; 
	    padding: 10px; 
	    font-size: 16px; 
	    border: none; 
	    border-radius: 6px; 
	    box-sizing: border-box; 
	    }
    button { 
	    padding: 10px 14px; 
	    background: #38bdf8; 
	    color: #0f172a; 
	    border: none; 
	    border-radius: 6px; 
	    font-size: 16px; 
	    font-weight: bold; 
	    cursor: pointer; 
	    }
    button:hover { 
	    background: #0ea5e9; 
	    }
    ul { 
	    list-style: none; 
	    padding: 0; 
	    margin: 0; 
	    }
    li { 
	    background: #334155; 
	    margin-bottom: 8px; 
	    padding: 10px; 
	    border-radius: 6px; 
	    display: flex; 
	    justify-content: space-between; 
	    align-items: center; 
	    }
    .actions { 
	    display: flex; 
	    gap: 5px;
	    }
    .edit-btn { 
	    background: #facc15; 
	    color: #0f172a; 
	    border: none; 
	    padding: 5px 8px; 
	    border-radius: 4px; 
	    cursor: pointer; 
	    font-size: 14px; 
	    }
    .delete-btn { 
	    background: #ef4444; 
	    color: white; 
	    border: none; 
	    padding: 5px 8px; 
	    border-radius: 4px; 
	    cursor: pointer; 
	    font-size: 14px; 
	    }
    </style>
</head>
<body>
    <div class="card">
    <h2>🍎 Миний жимсний жагсаалт (Array + JSON)</h2>
    
    <div class="input-group">
        <input type="text" id="fruitInput" placeholder="Шинэ жимс нэмэх...">
        <button id="addBtn">Нэмэх</button>
    </div>

    <ul id="fruitList"></ul>
    </div>


    <script src="js/script.js"></script>
</body>
</html>
